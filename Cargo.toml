[package]
name = "storage-analyzer"
version = "0.1.0"
edition = "2024"
description = "Browse disks, partitions and folders as a proportional box map in the terminal"

[dependencies]
libc = "0.2"
ratatui = "0.30"
rayon = "1"
rustix = { version = "1", features = ["fs"] }
unicode-width = "0.2"

[target.'cfg(target_pointer_width = "64")'.dependencies]
mimalloc = "0.1"

[profile.release]
codegen-units = 1
lto = true
strip = true
