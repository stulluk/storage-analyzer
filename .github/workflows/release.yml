name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the toolchain image
        run: ./dockerbuild.sh

      - name: Test, lint and build the static binary
        run: ./indockerbuild.sh

      - name: Check the binary
        run: |
          file out/storage-analyzer | grep -q 'static'
          ./out/storage-analyzer --version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          asset="storage-analyzer-x86_64-linux-musl"
          cp out/storage-analyzer "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release delete "$version" --cleanup-tag --yes || true
          gh release create "$version" "$asset" "$asset.sha256" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "Static Linux x86_64 binary built from $GITHUB_SHA."
